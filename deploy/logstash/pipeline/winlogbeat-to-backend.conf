input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    remove_field => ["@version", "ecs"]
  }
}

output {
  http {
    url => "http://backend:8000/logs"
    http_method => "post"
    format => "json"
    content_type => "application/json"
    headers => {
      "X-NetGuardian-Api-Key" => "${NETGUARDIAN_API_KEY:}"
    }
    retry_failed => true
    automatic_retries => 3
  }

  stdout {
    codec => dots
  }
}
